name: mugloar-dev

services:
  db:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mugloar}
      POSTGRES_USER: ${POSTGRES_USER:-mugloar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mugloar}
    volumes:
      - mugloar-dev-db:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mugloar-dev-db:
